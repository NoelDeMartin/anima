packages:
  - e2e
  - apps/*
  - packages/*
  - '!**/src-tauri/**'

allowBuilds:
  core-js: true
  esbuild: true
  vue-demi: true

catalog:
  '@noeldemartin/solid-utils': next
  '@noeldemartin/utils': next
  '@solid/community-server': ^7.2.0
  '@tailwindcss/vite': ^4.1.18
  '@vitejs/plugin-vue': ^6.0.4
  ai: ^7.0.0
  soukai-bis: next
  tailwindcss: ^4.1.18
  typescript: ~5.9.3
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vite-plus: latest
  vitest: latest
  vue: ^3.5.28
  zod: ^4.3.6

minimumReleaseAgeExclude:
  - '@aerogel/*'
  - '@noeldemartin/*'
  - '@voidzero-dev/*'
  - playwright-solid
  - soukai-bis
  - vite-plus

overrides:
  '@vue/compat': beta
  '@vue/compiler-core': beta
  '@vue/compiler-dom': beta
  '@vue/compiler-sfc': beta
  '@vue/compiler-ssr': beta
  '@vue/compiler-vapor': beta
  '@vue/reactivity': beta
  '@vue/runtime-core': beta
  '@vue/runtime-dom': beta
  '@vue/runtime-vapor': beta
  '@vue/server-renderer': beta
  '@vue/shared': beta
  vite: 'catalog:'
  vue: beta

patchedDependencies:
  '@elysiajs/node@1.4.5': patches/@elysiajs__node@1.4.5.patch
  '@inrupt/solid-client-authn-core': patches/@inrupt__solid-client-authn-core.patch
  '@inrupt/solid-client-authn-node': patches/@inrupt__solid-client-authn-node.patch

peerDependencyRules:
  allowAny:
    - vue
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
