name: CI

on:
  pull_request:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.20.0
        with:
          node-version-file: '.node-version'
          cache: true
      - uses: luizm/action-sh-checker@v0.9.0
        with:
          sh_checker_exclude: 'node_modules'
      - run: vp check
      - run: vp run --filter '!@anima/native' build

  web-e2e:
    strategy:
      matrix:
        mode: [external, managed, spa]
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.20.0
        with:
          node-version-file: '.node-version'
          cache: true
      - run: vp run e2e#install-deps -- ${{ matrix.browser }}
      - run: vp run e2e:${{ matrix.mode }} -- --project ${{ matrix.browser }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && failure() }}
        with:
          name: test-results-${{ matrix.mode }}-${{ matrix.browser }}
          path: e2e/test-results/
          retention-days: 30

  web-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [web-ci, web-e2e]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ORIGIN_TRIALS: ${{ secrets.ORIGIN_TRIALS }}
      VITE_SPA_MODE: 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.20.0
        with:
          node-version-file: '.node-version'
          cache: true
      - run: vp run frontend#deploy

  native-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup VP
        uses: voidzero-dev/setup-vp@v1.20.0
        with:
          node-version-file: '.node-version'
          cache: true
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Setup Rust caching
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/native/src-tauri
      - name: Setup Rust dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev xvfb
      - name: Setup E2E dependencies
        run: vp run e2e#install-deps -- chromium
      - name: Prepare
        run: vp run --filter @anima/native tauri:prepare
      - name: Lint
        run: |
          cargo fmt --manifest-path apps/native/src-tauri/Cargo.toml --check
          cargo clippy --manifest-path apps/native/src-tauri/Cargo.toml -- -D warnings
      - name: Build
        run: vp run --filter @anima/native build:debug
      - name: Run E2E
        run: xvfb-run -a vp run e2e:native -- --project chromium
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && failure() }}
        with:
          name: test-results-native-chromium
          path: e2e/test-results/
          retention-days: 30

  native-deploy:
    if: github.ref == 'refs/heads/main'
    needs: native-ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact-path: apps/native/src-tauri/target/release/bundle/appimage/*.AppImage
          - os: macos-latest
            platform: macos
            artifact-path: apps/native/src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-latest
            platform: windows
            artifact-path: apps/native/src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Setup VP
        uses: voidzero-dev/setup-vp@v1.20.0
        with:
          node-version-file: '.node-version'
          cache: true
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Setup Rust caching
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/native/src-tauri
      - name: Setup Rust dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Prepare
        run: vp run --filter @anima/native tauri:prepare
      - name: Build
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          NO_STRIP: 'true'
        run: vp run --filter @anima/native build
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && !failure() }}
        with:
          name: native-binaries-${{ matrix.platform }}
          path: ${{ matrix.artifact-path }}
