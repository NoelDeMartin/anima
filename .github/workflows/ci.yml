name: CI

on:
  pull_request:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.20.0
        with:
          node-version-file: '.node-version'
          cache: true
      - uses: luizm/action-sh-checker@v0.9.0
        with:
          sh_checker_exclude: 'node_modules'
      - run: vp check
      - run: vp run --filter '!@anima/native' build

  web-e2e:
    strategy:
      matrix:
        mode: [external, managed, spa]
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.20.0
        with:
          node-version-file: '.node-version'
          cache: true
      - run: vp run e2e#install-deps -- ${{ matrix.browser }}
      - run: vp run e2e:${{ matrix.mode }} -- --project ${{ matrix.browser }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && failure() }}
        with:
          name: test-results-${{ matrix.mode }}-${{ matrix.browser }}
          path: e2e/test-results/
          retention-days: 30

  web-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [web-ci, web-e2e]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ORIGIN_TRIALS: ${{ secrets.ORIGIN_TRIALS }}
      VITE_SPA_MODE: 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.20.0
        with:
          node-version-file: '.node-version'
          cache: true
      - run: vp run frontend#deploy

  native-ci:
    uses: ./.github/workflows/native-ci.yml
