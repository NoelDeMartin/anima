name: Native Build

on:
  workflow_dispatch:
    inputs:
      linux:
        description: 'Build Linux (AppImage)'
        type: boolean
        default: true
      linux-legacy:
        description: 'Build Linux legacy (AppImage, glibc 2.35 / Ubuntu 22.04)'
        type: boolean
        default: true
      macos:
        description: 'Build macOS (DMG)'
        type: boolean
        default: true
      windows:
        description: 'Build Windows (NSIS)'
        type: boolean
        default: true

jobs:
  native-ci:
    uses: ./.github/workflows/native-ci.yml

  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has-targets: ${{ steps.set-matrix.outputs.has-targets }}
    steps:
      - id: set-matrix
        run: |
          TARGETS=()
          [ "${{ inputs.linux }}" = "true" ] && TARGETS+=('{"os":"ubuntu-latest","platform":"linux","artifact_path":"apps/native/src-tauri/target/release/bundle/appimage/*.AppImage"}')
          [ "${{ inputs.linux-legacy }}" = "true" ] && TARGETS+=('{"os":"ubuntu-22.04","platform":"linux-legacy","artifact_path":"apps/native/src-tauri/target/release/bundle/appimage/*.AppImage"}')
          [ "${{ inputs.macos }}" = "true" ] && TARGETS+=('{"os":"macos-latest","platform":"macos","artifact_path":"apps/native/src-tauri/target/release/bundle/dmg/*.dmg"}')
          [ "${{ inputs.windows }}" = "true" ] && TARGETS+=('{"os":"windows-latest","platform":"windows","artifact_path":"apps/native/src-tauri/target/release/bundle/nsis/*.exe"}')

          if [ ${#TARGETS[@]} -eq 0 ]; then
            echo "has-targets=false" >> "$GITHUB_OUTPUT"
            echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
          else
            JOINED=$(IFS=,; echo "${TARGETS[*]}")
            echo "has-targets=true" >> "$GITHUB_OUTPUT"
            echo "matrix={\"include\":[$JOINED]}" >> "$GITHUB_OUTPUT"
          fi

  native-build:
    needs: [native-ci, prepare]
    if: needs.prepare.outputs.has-targets == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Setup VP
        uses: voidzero-dev/setup-vp@v1.20.0
        with:
          node-version-file: '.node-version'
          cache: true
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Setup Rust caching
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/native/src-tauri
          key: ${{ matrix.platform }}
      - name: Setup Rust dependencies
        if: startsWith(matrix.platform, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Prepare
        run: vp run --filter @anima/native tauri:prepare
      - name: Build
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          NO_STRIP: 'true'
        run: vp run --filter @anima/native build
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && !failure() }}
        with:
          name: anima-${{ matrix.platform }}
          path: ${{ matrix.artifact_path }}
