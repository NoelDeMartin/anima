name: Native Build

on:
  workflow_dispatch:
    inputs:
      linux:
        description: 'Build Linux (AppImage)'
        type: boolean
        default: true
      macos:
        description: 'Build macOS (DMG)'
        type: boolean
        default: true
      windows:
        description: 'Build Windows (NSIS)'
        type: boolean
        default: true

jobs:
  native-ci:
    uses: ./.github/workflows/native-ci.yml

  native-build:
    needs: native-ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact-path: apps/native/src-tauri/target/release/bundle/appimage/*.AppImage
          - os: macos-latest
            platform: macos
            artifact-path: apps/native/src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-latest
            platform: windows
            artifact-path: apps/native/src-tauri/target/release/bundle/nsis/*.exe
    if: |
      (matrix.platform == 'linux' && inputs.linux) ||
      (matrix.platform == 'macos' && inputs.macos) ||
      (matrix.platform == 'windows' && inputs.windows)
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Setup VP
        uses: voidzero-dev/setup-vp@v1.20.0
        with:
          node-version-file: '.node-version'
          cache: true
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Setup Rust caching
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/native/src-tauri
      - name: Setup Rust dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Prepare
        run: vp run --filter @anima/native tauri:prepare
      - name: Build
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          NO_STRIP: 'true'
        run: vp run --filter @anima/native build
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && !failure() }}
        with:
          name: native-binaries-${{ matrix.platform }}
          path: ${{ matrix.artifact-path }}
