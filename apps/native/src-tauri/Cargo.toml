[package]
name = "anima"
version = "0.0.0"
description = "Ànima"
authors = ["Noel De Martin"]
license = "MIT"
repository = "https://github.com/NoelDeMartin/anima"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "anima_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
