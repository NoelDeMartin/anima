[package]
name = "anima"
version = "0.0.0"
description = "Ànima: The AI that works for you"
authors = ["Noel De Martin"]
license = "MIT"
repository = "https://github.com/NoelDeMartin/anima"
edition = "2021"
rust-version = "1.90"

[lib]
name = "anima_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde_json = "1"
